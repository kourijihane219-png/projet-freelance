<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Freelance</title>
    <link rel="stylesheet" href="inscription.css">
</head>
<body>

<header>
    <h2>Freelance</h2>
    <nav>
        <a href="acceuil.html">Accueil</a>
        <a href="connexion.html">Connexion</a>
    </nav>
</header>

<main class="container">
    <form id="formInscription">
        <h1>Créer un compte</h1>
        <p>Rejoignez notre plateforme Freelance.</p>

        <label>Nom complet</label>
        <input type="text" id="nom" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Type de compte</label>
        <select id="typeCompte">
            <option value="client">Client</option>
            <option value="freelance">Freelance</option>
        </select>

        <label>Mot de passe</label>
        <input type="password" id="motDePasse" minlength="6" required>

        <label>Confirmer le mot de passe</label>
        <input type="password" id="confirmation" required>

        <button type="submit">S'inscrire</button>

        <p id="message"></p>

        <p>Déjà inscrit ?
            <a href="connexion.html">Se connecter</a>
        </p>
    </form>
</main>

<footer>
    © 2026 Freelance - Tous droits réservés
</footer>

<script src="inscription.js"></script>
</body>
</html>
